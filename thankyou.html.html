<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ขอบคุณสำหรับการสั่งซื้อ - StudyMate Essentials</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thankyou-box {
      max-width: 550px;
      margin: 4rem auto;
      background: var(--bg-card);
      padding: 3rem 2rem;
      border-radius: var(--border-radius-lg);
      text-align: center;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
    .icon-success {
      width: 80px;
      height: 80px;
      background: var(--primary-peach-light);
      color: var(--primary-peach);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
    }
    .thankyou-box h1 {
      font-size: 2rem;
      margin-bottom: 0.8rem;
      color: var(--text-dark);
    }
    .thankyou-box p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🎓</div>
        StudyMate <span>Essentials</span>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="thankyou-box">
      <div class="icon-success">🎉</div>
      <h1>ขอบคุณสำหรับการสั่งซื้อ!</h1>
      <p>
        เราได้รับรายการสั่งซื้อของคุณเรียบร้อยแล้ว<br>
        ทีมงาน StudyMate Essentials จะรีบดำเนินการจัดส่งสินค้าให้โดยเร็วที่สุด
      </p>
      <a href="index.html" class="cat-btn active" style="font-size: 1rem; padding: 0.8rem 2rem; display: inline-block;">
        🏠 กลับสู่หน้าแรก
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-bottom">
      <p>&copy; 2026 StudyMate Essentials (Uniman). All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
