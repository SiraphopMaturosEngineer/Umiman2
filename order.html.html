<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า - StudyMate Essentials</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-container {
      max-width: 600px;
      margin: 3rem auto;
      background: var(--bg-card);
      padding: 2.5rem;
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
    }
    .form-group {
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-group label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-sm);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: var(--transition-fast);
      background-color: var(--bg-main);
    }
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--primary-peach);
      box-shadow: 0 0 0 3px rgba(255, 138, 122, 0.2);
      background-color: #ffffff;
    }
    .form-group input[readonly] {
      background-color: var(--secondary-blue-light);
      color: var(--text-dark);
      font-weight: 600;
      cursor: not-allowed;
    }
    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: var(--primary-peach);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: var(--border-radius-pill);
      margin-top: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .submit-btn:hover {
      background: var(--primary-peach-hover);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🎓</div>
        StudyMate <span>Essentials</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
        <a href="admin.html">สำหรับผู้ดูแลระบบ</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="order-container">
      <h2 style="text-align: center; margin-bottom: 0.5rem; color: var(--text-dark);">ฟอร์มสั่งซื้อสินค้า</h2>
      <p style="text-align: center; margin-bottom: 2rem; color: var(--text-muted); font-size: 0.9rem;">
        กรอกข้อมูลจัดส่งเพื่อยืนยันรายการสั่งซื้อของคุณ
      </p>

      <form id="orderForm">
        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" readonly placeholder="กำลังดึงข้อมูลสินค้า..." required>
        </div>

        <div class="form-group">
          <label for="total">ราคารวม (บาท)</label>
          <input type="text" id="total" name="total" readonly placeholder="0" required>
        </div>

        <div class="form-group">
          <label for="customerName">ชื่อ-นามสกุล ผู้รับ</label>
          <input type="text" id="customerName" name="customerName" placeholder="เช่น สมชาย ใจดี" required>
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทรศัพท์ / ช่องทางติดต่อ (Line ID, IG)</label>
          <input type="text" id="contact" name="contact" placeholder="เช่น 081-234-5678 หรือ Line: @studymate" required>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุเพิ่มเติม (ถ้ามี)</label>
          <textarea id="note" name="note" rows="3" placeholder="เช่น รายละเอียดที่อยู่จัดส่ง, เลขห้องหอพัก หรือช่วงเวลาที่สะดวกรับสาย"></textarea>
        </div>

        <button type="submit" class="submit-btn">ยืนยันการสั่งซื้อ ➔</button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-bottom">
      <p>&copy; 2026 StudyMate Essentials (Uniman). All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
